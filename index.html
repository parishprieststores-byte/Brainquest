function mathQ(lv,st){const k=lv*10+st*2;let a,b,op,ans,t;
 if(lv==1){a=rnd(5+k)+2;b=rnd(5+k)+1;op=rnd(2)?"+":"−";if(op=="−"&&b>a)[a,b]=[b,a];ans=op=="+"?a+b:a-b;t=`${a} ${op} ${b}`}
 else if(lv==2){a=rnd(8+st)+2;b=rnd(8+st)+2;if(rnd(2)){op="×";ans=a*b}else{op="+";a*=rnd(9)+5;b*=rnd(9)+5;ans=a+b}t=`${a} ${op} ${b}`}
 else{const m=rnd(3);if(m==0){a=rnd(10+st)+5;op="²";ans=a*a;t=`${a}²`}else if(m==1){a=(rnd(9)+2)*10;b=[10,20,25,50][rnd(4)];ans=a*b/100;t=`${b}% of ${a}`}else{a=rnd(12)+3;b=rnd(12)+3;const c=rnd(20)+5;ans=a*b+c;t=`${a} × ${b} + ${c}`}}
 const w=new Set();while(w.size<3){const d=ans+(rnd(2)?1:-1)*(rnd(9)+1);if(d!=ans&&d>=0)w.add(d)}
 return{q:`What is ${t}?`,c:String(ans),o:[String(ans),...[...w].map(String)],f:`${t} = ${ans}`}}
